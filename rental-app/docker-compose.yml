version: '3.8'

services:
  web:
    build: .
    container_name: vehicle-rental-app
    ports:
      - "8080:80"
    environment:
      - CI_ENVIRONMENT=development
      - database.default.hostname=postgres
      - database.default.database=rental_kendaraan
      - database.default.username=postgres
      - database.default.password=postgres
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
    networks:
      - rental-network

  postgres:
    image: postgres:14-alpine
    container_name: rental-postgres
    environment:
      - POSTGRES_DB=rental_kendaraan
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rental-network

  adminer:
    image: adminer
    container_name: rental-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres
    networks:
      - rental-network

volumes:
  postgres_data:

networks:
  rental-network:
    driver: bridge
